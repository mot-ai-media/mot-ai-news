<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok認証コールバック</title>
<meta name="robots" content="noindex">
</head>
<body style="font-family:sans-serif;max-width:640px;margin:60px auto;padding:0 20px;">
<h1>TikTok認証</h1>
<p>下のコードをコピーして、ターミナルに貼り付けてください。</p>
<textarea id="code" readonly style="width:100%;height:80px;font-size:16px;padding:10px;"></textarea>
<script>
  var params = new URLSearchParams(window.location.search);
  document.getElementById('code').value = params.get('code') || '(codeが見つかりません。URLを確認してください)';
</script>
</body>
</html>
